version: 2

project_name: aiwf

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/aiwf
    binary: aiwf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: agaspardev
    name: aiwf
  # Publicar los instaladores como assets del release: el one-liner documentado
  # (releases/latest/download/install.sh|.ps1) los descarga desde acá.
  extra_files:
    - glob: install.sh
    - glob: install.ps1
